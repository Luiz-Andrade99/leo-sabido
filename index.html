<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Leo Sabido: Aventuras do Conhecimento — jogo educativo de plataforma." />
    <title>Leo Sabido</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Isolamento de origem para a voz Faber usar vários núcleos (ver coi-sw.js).
      // Na primeira visita o worker é instalado e a página recarrega uma única vez.
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.get('teste') === '1' && q.get('voz') !== 'faber') return;
        if (window.crossOriginIsolated || !('serviceWorker' in navigator) || !window.isSecureContext) return;
        navigator.serviceWorker
          .register('./coi-sw.js')
          .then(function () {
            try {
              if (sessionStorage.getItem('leo-coi')) return;
              sessionStorage.setItem('leo-coi', '1');
            } catch (e) {
              return;
            }
            navigator.serviceWorker.ready.then(function () {
              location.reload();
            });
          })
          .catch(function () {});
      })();
    </script>
  </head>
  <body>
    <main id="app" aria-label="Leo Sabido: Aventuras do Conhecimento">
      <div id="game" role="application" aria-label="Área do jogo. Use as setas para andar, espaço para pular, E para examinar e Esc para pausar."></div>
      <div id="hud" hidden></div>
      <div id="touch" hidden></div>
      <div id="screen" hidden></div>
      <div id="overlay"></div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
